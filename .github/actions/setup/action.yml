name: setup
description: Haxe, hxcpp, Ash, the hxn command and the haxelibs hxnme runs on, with this checkout's packages as dev links.

inputs:
  gpu:
    description: true to install the GPU drivers of the runner's platform, and on Linux the libraries a window and a GPU need.
    default: "false"
  hashlink:
    description: true to install stock HashLink 1.15 and set HL to its command.
    default: "false"
  web:
    description: true to install the Emscripten SDK, node and the browser GPU drivers, for runs in a web page.
    default: "false"

runs:
  using: composite
  steps:
    - if: runner.os != 'macOS'
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: 4.3.6
    # setup-haxe has no Haxe for arm64 macOS, which Homebrew has. coreutils gives `timeout`.
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install haxe coreutils
        mkdir -p "$HOME/haxelib" && haxelib setup "$HOME/haxelib"
    # The hxcpp commit the hxn libraries are tested with.
    - shell: bash
      run: |
        haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp --quiet
        dir="$(haxelib libpath hxcpp)"
        git -C "$dir" checkout -q 615adc73d5ef28f3f74ea47977c39c4f25ce256d
        (cd "$dir/tools/hxcpp" && haxe compile.hxml)
    # hxnme uses hxn after 0.3.10: typed buffers in each runtime's layout, program files
    # for hxn run and hxn check, and Ash builds ahead of time. The command and the haxelib
    # come from the same commit.
    - shell: bash
      run: echo "HXN_REV=ad0310c501334106488db8993791cda7b46fdf4c" >> "$GITHUB_ENV"
    - id: hxn-cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/hxn*
        key: hxn-${{ runner.os }}-${{ env.HXN_REV }}
    - if: steps.hxn-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --git https://github.com/hx-n/hxn.git --rev "$HXN_REV" --locked hxn-cli
    - shell: bash
      run: |
        git clone -q https://github.com/hx-n/hxn.git "$RUNNER_TEMP/hxn"
        git -C "$RUNNER_TEMP/hxn" checkout -q "$HXN_REV"
        hxn version
    # Each release is installed without its dependencies, which are all listed here.
    # A dev link overrides the version a dependency asks for, so every library sees the
    # same hxn and the same hxnme packages.
    - shell: bash
      run: |
        # Each platform's default GPU drivers, as hxnme-gpu's manifest lists them.
        drivers=""
        if [ "${{ inputs.gpu }}" = true ]; then
          case "$RUNNER_OS" in
            macOS) drivers="hxn-gpu-metal:0.2.4" ;;
            Linux) drivers="hxn-gpu-vulkan:0.3.3 hxn-gpu-gles:0.3.3" ;;
            Windows) drivers="hxn-gpu-d3d12:0.2.3" ;;
          esac
        fi
        if [ "${{ inputs.web }}" = true ]; then
          drivers="$drivers hxn-gpu-webgpu:0.3.6 hxn-gpu-webgl2:0.3.5"
        fi
        for lib in format:3.8.0 hashlink:1.15.0 ash-simd:0.1.1 hxnsl:0.2.1 hxn-file:0.2.2 hxn-assets:0.2.2 \
          hxn-text:0.1.0 hxn-window:0.2.3 hxn-gpu:0.2.5 $drivers; do
          haxelib install "${lib%%:*}" "${lib##*:}" --always --skip-dependencies
        done
        haxelib dev hxn "$RUNNER_TEMP/hxn"
        for package in packages/*/; do
          haxelib dev "$(basename "$package")" "$package"
        done
    - shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux) archive=ash-linux-x86_64.tar.gz ;;
          macOS) archive=ash-macos-aarch64.tar.gz ;;
          Windows) archive=ash-windows-x86_64.tar.gz ;;
        esac
        mkdir -p "$RUNNER_TEMP/ash"
        # Extracted in place: tar reads a Windows path's drive as a host.
        (cd "$RUNNER_TEMP/ash" && curl -fsSL "https://github.com/rayzor-blade/ash/releases/download/v0.1.22/$archive" | tar -xz)
        echo "ASH=$RUNNER_TEMP/ash/ash" >> "$GITHUB_ENV"
    # On Windows, Ash links a program that loads HDLLs against an import library for
    # libhl.dll, which its archive does not ship. Without it, Ash hands the DLL itself to
    # the linker. The import library is made from the DLL's exports, with each export
    # outside .text marked DATA. Programs load libhl.dll from PATH.
    - if: runner.os == 'Windows'
      shell: bash
      run: |
        bin="/c/Program Files/LLVM/bin"
        dll="$RUNNER_TEMP/ash/libhl.dll"
        start=0 size=0 text=0
        while read -r key value _; do
          case $key in
            Name:) [ "$value" = .text ] && text=1 || text=0 ;;
            VirtualSize:) [ $text = 1 ] && size=$((value)) ;;
            VirtualAddress:) [ $text = 1 ] && start=$((value)) ;;
          esac
        done < <("$bin/llvm-readobj" --sections "$dll")
        {
          echo "LIBRARY libhl.dll"
          echo "EXPORTS"
          while read -r key value _; do
            case $key in
              Name:) name=$value ;;
              RVA:)
                rva=$((value))
                if [ $rva -lt $start ] || [ $rva -ge $((start + size)) ]; then echo "  $name DATA"; else echo "  $name"; fi ;;
            esac
          done < <("$bin/llvm-readobj" --coff-exports "$dll")
        } > "$RUNNER_TEMP/ash/libhl.def"
        "$bin/llvm-dlltool" -m i386:x86-64 -d "$RUNNER_TEMP/ash/libhl.def" -D libhl.dll -l "$RUNNER_TEMP/ash/libhl.dll.lib"
        echo "$(cygpath -w "$RUNNER_TEMP/ash")" >> "$GITHUB_PATH"
    - if: runner.os == 'Linux' && inputs.gpu == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libegl1 libgles2 libegl-mesa0 libgl1-mesa-dri \
          libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libudev-dev xvfb xauth
    # Stock HashLink 1.15, with fmt.hdll, which hxn-assets uses to decode PNG files.
    # HashLink's JIT has no arm64 build, so it runs on the Linux and Windows runners.
    - if: inputs.hashlink == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get install -y libpng-dev libturbojpeg0-dev libvorbis-dev zlib1g-dev > /dev/null
        git clone -q --depth 1 --branch 1.15 https://github.com/HaxeFoundation/hashlink "$RUNNER_TEMP/hashlink"
        make -C "$RUNNER_TEMP/hashlink" libhl hl fmt > /dev/null
        echo "HL=$RUNNER_TEMP/hashlink/hl" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/hashlink${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
    - if: inputs.hashlink == 'true' && runner.os == 'Windows'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        temp="$(cygpath -u "$RUNNER_TEMP")"
        gh release download 1.15 --repo HaxeFoundation/hashlink --pattern '*-win.zip' --dir "$temp"
        unzip -q "$temp"/*-win.zip -d "$temp/hl"
        echo "HL=$(cygpath -w "$(find "$temp/hl" -name hl.exe | head -1)")" >> "$GITHUB_ENV"
    - if: inputs.web == 'true'
      shell: bash
      run: |
        git clone -q --depth 1 https://github.com/emscripten-core/emsdk "$RUNNER_TEMP/emsdk"
        "$RUNNER_TEMP/emsdk/emsdk" install 5.0.7 > /dev/null
        "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.7 > /dev/null
        echo "$RUNNER_TEMP/emsdk" >> "$GITHUB_PATH"
        echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
    - if: inputs.web == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 22
