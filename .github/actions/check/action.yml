name: check
description: >-
  Runs a check program on one runtime. On Ash, the program runs in hybrid mode, and the
  executable that Ash builds ahead of time must print the same output. On hxcpp and CPPIA,
  hxn check runs it there and on Ash, and fails unless both print the same output. On
  stock HashLink, it runs there and on Ash, and fails unless both print the same output.

inputs:
  directory:
    description: The directory of the program file.
    required: true
  file:
    description: The program file.
    default: app.hxml
  runtime:
    description: ash, cpp, cppia or hashlink.
    required: true
  ash-modes:
    description: The Ash runs compared with hybrid mode, from "jit interp aot". Hybrid mode covers CI. JIT and interpreter runs isolate one tier when debugging.
    default: aot
  ash-options:
    description: Options for every Ash run, such as --no-fma.
    default: ""
  compare:
    description: false to run on hxcpp or CPPIA without comparing with Ash.
    default: "true"
  minutes:
    description: The time limit for each run, in minutes.
    default: "20"

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.directory }}
      run: |
        # Every run is reported, so one failure does not hide the others.
        set +e
        limit=$(( ${{ inputs.minutes }} * 60 ))
        file=${{ inputs.file }}
        vm="$ASH ${{ inputs.ash-options }}"
        wrap=()
        # On Linux, windows open on a virtual X display when the setup installed one.
        if [ "$RUNNER_OS" = Linux ] && command -v xvfb-run > /dev/null; then wrap=(xvfb-run -a); fi
        status=0
        # fail <message>: reports a failure and carries on.
        fail() { echo "::error::$1 in ${{ inputs.directory }}"; status=1; }
        case ${{ inputs.runtime }} in
          ash)
            # The program's output is on stdout. Ash and hxn write their own messages to stderr.
            echo "== Ash"
            timeout $limit "${wrap[@]}" hxn run hl $file --vm "$vm" > ash.txt 2> ash.err
            code=$?
            cat ash.txt
            [ $code -eq 0 ] || { cat ash.err; fail "the check failed on Ash"; }
            # same <name> <code> <file> <errors>: fails unless the run exited with 0 and printed what hybrid mode printed.
            same() {
              if [ "$2" -ne 0 ] || ! diff -u ash.txt "$3"; then cat "$4"; fail "$1 differs from hybrid mode"; fi
            }
            for mode in ${{ inputs.ash-modes }}; do
              echo "== $mode"
              case $mode in
                jit|interp)
                  timeout $limit "${wrap[@]}" hxn run hl $file --vm "$vm --mode $mode" > $mode.txt 2> $mode.err
                  same "Ash $mode mode" $? $mode.txt $mode.err ;;
                aot)
                  if ! timeout $limit hxn build hl $file --ash "$ASH" > build.txt 2>&1; then
                    cat build.txt
                    fail "the Ash build failed"
                    continue
                  fi
                  # hxn build prints the executable's path on its last line.
                  program=$(tail -1 build.txt | sed 's/^ *//')
                  timeout $limit "${wrap[@]}" "$program" > aot.txt 2> aot.err
                  same "the Ash executable" $? aot.txt aot.err ;;
              esac
            done ;;
          cpp|cppia)
            if [ "${{ inputs.compare }}" = true ]; then
              echo "== hxn check hl ${{ inputs.runtime }} $file"
              timeout $limit "${wrap[@]}" hxn check hl ${{ inputs.runtime }} $file --vm "$vm" || fail "hxn check failed"
            else
              echo "== hxn run ${{ inputs.runtime }} $file"
              timeout $limit "${wrap[@]}" hxn run ${{ inputs.runtime }} $file || fail "the check failed on ${{ inputs.runtime }}"
            fi ;;
          hashlink)
            echo "== HashLink"
            timeout $limit "${wrap[@]}" hxn run hl $file --vm "$HL" > hl.txt 2> hl.err
            code=$?
            cat hl.txt
            [ $code -eq 0 ] || { cat hl.err; fail "the check failed on HashLink"; }
            timeout $limit "${wrap[@]}" hxn run hl $file --vm "$vm" > ash.txt 2> ash.err
            # On Windows, the two runtimes end lines differently.
            diff -u <(tr -d '\r' < ash.txt) <(tr -d '\r' < hl.txt) || fail "HashLink differs from Ash" ;;
          *)
            fail "unknown runtime ${{ inputs.runtime }}" ;;
        esac
        exit $status
