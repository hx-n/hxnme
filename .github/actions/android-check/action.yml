name: android-check
description: >-
  Builds a check program for Android with Ash, runs it on the booted emulator from its
  pushed output directory, and fails unless it prints what the same program prints as a
  desktop Ash executable.

inputs:
  directory:
    description: The directory of the program file.
    required: true
  file:
    description: The program file.
    default: app.hxml
  compare:
    description: false to require only that the program exits with 0, for output that Android's math library rounds differently.
    default: "true"
  minutes:
    description: The time limit for each build and run, in minutes.
    default: "20"

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.directory }}
      run: |
        set +e
        limit=$(( ${{ inputs.minutes }} * 60 ))
        file=${{ inputs.file }}
        # build <log> <options...>: builds the program and prints the executable's path,
        # which hxn build prints on its last line.
        build() {
          local log=$1; shift
          if ! timeout $limit hxn build hl $file --ash "$ASH" "$@" > $log 2>&1; then
            cat $log >&2
            return 1
          fi
          tail -1 $log | sed 's/^ *//'
        }
        if [ "${{ inputs.compare }}" = true ]; then
          echo "== desktop"
          desktop=$(build desktop.txt) || { echo "::error::the desktop build failed in ${{ inputs.directory }}"; exit 1; }
          timeout $limit "$desktop" > expected.txt 2> expected.err || { cat expected.err; echo "::error::the desktop executable failed in ${{ inputs.directory }}"; exit 1; }
        fi
        echo "== Android emulator"
        # hxn-file links against libandroid and liblog, which Ash does not add itself.
        program=$(ASH_LINK_ARGS="-landroid -llog" build android.txt --target "$ANDROID_TRIPLE") \
          || { echo "::error::the Android build failed in ${{ inputs.directory }}"; exit 1; }
        dest="/data/local/tmp/hxnme/$(echo "${{ inputs.directory }}/$file" | tr '/.' '--')"
        adb shell "rm -rf $dest && mkdir -p $dest" && adb push "$(dirname "$program")/." "$dest" > /dev/null
        # adb shell returns the program's exit code. Its output has CRLF line endings.
        timeout $limit adb shell "cd $dest && ASH_GC_TLAB=${ASH_GC_TLAB:-} ./$(basename "$program")" > out.raw 2> out.err
        code=$?
        tr -d '\r' < out.raw > out.txt
        cat out.txt
        if [ $code -ne 0 ]; then
          cat out.err
          echo "::error::the Android run in ${{ inputs.directory }} failed"
          exit 1
        fi
        if [ "${{ inputs.compare }}" = true ] && ! diff -u expected.txt out.txt; then
          echo "::error::the Android run in ${{ inputs.directory }} differs from the desktop"
          exit 1
        fi
