name: checks

# Every check on one runtime, on macOS, Linux and Windows. ash.yml, hxcpp.yml and
# cppia.yml call it, one per runtime.
on:
  workflow_call:
    inputs:
      runtime:
        description: ash, cpp, cppia or hashlink.
        type: string
        required: true
      oses:
        description: The runners, as a JSON array.
        type: string
        default: '["macos-15", "ubuntu-latest", "windows-latest"]'

defaults:
  run:
    shell: bash

jobs:
  # The kernel's checks open no window.
  kernel:
    name: kernel, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Haxe, hxcpp, Ash, hxn and the haxelibs
        id: setup
        uses: ./.github/actions/setup
        with:
          hashlink: ${{ inputs.runtime == 'hashlink' }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme/tests/toml-checks.hxml
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme/tests
          file: toml-checks.hxml
          runtime: ${{ inputs.runtime }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme/tests/plugins
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme/tests/plugins
          runtime: ${{ inputs.runtime }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme/tests/systems
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme/tests/systems
          runtime: ${{ inputs.runtime }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme/tests/loop
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme/tests/loop
          runtime: ${{ inputs.runtime }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme/tests/headless
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme/tests/headless
          runtime: ${{ inputs.runtime }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme/tests/libraries
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme/tests/libraries
          runtime: ${{ inputs.runtime }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme/tests/libraries-override
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme/tests/libraries-override
          runtime: ${{ inputs.runtime }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme/tests/assets
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme/tests/assets
          runtime: ${{ inputs.runtime }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme/tests/new
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme/tests/new
          runtime: ${{ inputs.runtime }}
      # Each error check compiles broken programs with Haxe's interpreter and expects
      # each one's compile error, so it runs in one workflow only.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.runtime == 'ash' }}
        name: Compile errors
        working-directory: packages/hxnme/tests
        run: |
          haxe plugin-errors.hxml
          haxe system-errors.hxml

  physics:
    name: physics, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # Ash otherwise counts allocations only in whole 32 KiB regions, and the allocation
    # checks around World.step can pass when the code allocates.
    env:
      ASH_GC_TLAB: "0"
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Haxe, hxcpp, Ash, hxn and the haxelibs
        id: setup
        uses: ./.github/actions/setup
        with:
          hashlink: ${{ inputs.runtime == 'hashlink' }}
      # With --no-fma, Ash rounds each operation as hxcpp does, so hxcpp prints the same
      # output. CPPIA keeps Single values in double precision, so it is not compared.
      # hxn build takes no --no-fma, so the Ash executable is not compared either.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme-physics/tests/checks.hxml
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme-physics/tests
          file: checks.hxml
          runtime: ${{ inputs.runtime }}
          ash-options: --no-fma
          ash-modes: ""
          compare: ${{ inputs.runtime == 'cpp' }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme-physics/tests/concurrent-checks.hxml
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme-physics/tests
          file: concurrent-checks.hxml
          runtime: ${{ inputs.runtime }}
          ash-options: --no-fma
          ash-modes: ""
          compare: ${{ inputs.runtime == 'cpp' }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme-physics/tests/world-growth-checks.hxml
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme-physics/tests
          file: world-growth-checks.hxml
          runtime: ${{ inputs.runtime }}
          ash-options: --no-fma
          ash-modes: ""
          compare: ${{ inputs.runtime == 'cpp' }}
      # The island parallel checks print timings, so their output is not compared.
      # Each check program exits with an error when a check fails.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' && (inputs.runtime == 'cpp' || inputs.runtime == 'cppia') }}
        name: Island parallel checks
        working-directory: packages/hxnme-physics/tests
        run: timeout 1200 hxn run ${{ inputs.runtime }} island-parallel-checks.hxml
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.runtime == 'hashlink' }}
        name: Island parallel checks
        working-directory: packages/hxnme-physics/tests
        run: timeout 1200 hxn run hl island-parallel-checks.hxml --vm "$HL"
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.runtime == 'ash' }}
        name: Island parallel checks and SIMD paths
        working-directory: packages/hxnme-physics/tests
        run: |
          timeout 1200 hxn run hl island-parallel-checks.hxml --vm "$ASH"
          for file in checks concurrent-checks world-growth-checks island-parallel-checks; do
            echo "== Ash $file-simd"
            timeout 1200 hxn run hl $file-simd.hxml --vm "$ASH"
          done

  # The window, input, GPU and 2D plugins in a hidden window, and a game made with
  # `hxn me new`, on each platform's default GPU driver: Metal on macOS, Vulkan on
  # Mesa's software driver on Linux, and Direct3D 12 on Windows. hxnme-gpu's pacing
  # check needs a visible window on a display with vsync, which the runners do not have.
  plugins:
    name: plugins, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Haxe, hxcpp, Ash, hxn and the haxelibs
        id: setup
        uses: ./.github/actions/setup
        with:
          gpu: "true"
          hashlink: ${{ inputs.runtime == 'hashlink' }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme-window/tests/window
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme-window/tests/window
          runtime: ${{ inputs.runtime }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme-input/tests/input
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme-input/tests/input
          runtime: ${{ inputs.runtime }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme-gpu/tests/gpu
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme-gpu/tests/gpu
          runtime: ${{ inputs.runtime }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme-2d/tests/draw
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme-2d/tests/draw
          runtime: ${{ inputs.runtime }}
          minutes: 30
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: hxnme-2d/tests/assets
        uses: ./.github/actions/check
        with:
          directory: packages/hxnme-2d/tests/assets
          runtime: ${{ inputs.runtime }}
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.runtime == 'ash' }}
        name: Compile errors
        run: |
          (cd packages/hxnme-input/tests && haxe action-errors.hxml)
          (cd packages/hxnme-2d/tests && haxe asset-errors.hxml)
      # The game the template makes, for 60 frames in a small hidden window. The Windows
      # runners have no GPU, so Direct3D 12 renders in software there, and at the
      # template's size 120 frames did not finish in 20 minutes.
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: Create a game
        run: |
          mkdir -p "$RUNNER_TEMP/new"
          cd "$RUNNER_TEMP/new"
          hxn me new game
          perl -0pi -e 's/^\[app\]\n/[app]\nframes = 60\n/m; s/^\[window\]\n/[window]\nvisible = false\n/m; s/^width = \d+$/width = 160/m; s/^height = \d+$/height = 90/m' game/hxnme.toml
          cat game/hxnme.toml
          echo "GAME=$RUNNER_TEMP/new/game" >> "$GITHUB_ENV"
      - if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        name: the game made with hxn me new
        uses: ./.github/actions/check
        with:
          directory: ${{ env.GAME }}
          runtime: ${{ inputs.runtime }}
