name: hxcpp

# Every check on hxcpp, on macOS, Linux and Windows. checks.yml lists them.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      runtime: cpp
